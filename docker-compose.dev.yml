# MySQL only, for running the API and web app locally with `npm run dev`.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: reading_tracker
      MYSQL_USER: reading_tracker
      MYSQL_PASSWORD: ${DEV_MYSQL_PASSWORD:-change_me}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
