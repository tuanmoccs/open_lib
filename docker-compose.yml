# Production stack: MySQL + API + static web app behind Caddy (automatic HTTPS).
# Usage: cp .env.example .env && edit .env && docker compose up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Keep memory usage low on small VPS instances.
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reading_tracker}
      MYSQL_USER: ${MYSQL_USER:-reading_tracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-reading_tracker}
      DB_USER: ${MYSQL_USER:-reading_tracker}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Requests arrive through Caddy; trust exactly one proxy hop for client IPs.
      TRUST_PROXY: 1
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      RUN_MIGRATIONS: 'true'
      RUN_SEED: ${RUN_SEED:-true}
      OPEN_LIBRARY_CONTACT: ${OPEN_LIBRARY_CONTACT:-}
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

  web:
    build: ./web
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS (your domain) in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
